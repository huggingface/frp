[common]
log_level = trace
tcp_mux = true
bind_port = 7000
dashboard_port = 7001
vhost_http_port = 80
subdomain_host = gradio.live
detailed_errors_to_client = false
custom_404_page = /etc/frp/404.html

tls_enable = true
tls_cert_file = "/etc/frp/fullchain.pem"
tls_key_file = "/etc/frp/privkey.pem"

[logger]
logger_subdomain = stats.gradio.live
logger_port = 8765